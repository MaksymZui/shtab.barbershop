# VPS: docker compose -f docker-compose.prod.yml up -d --build
# Host Nginx proxies the domain to 127.0.0.1:8080
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
